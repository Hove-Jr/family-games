<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../hub-sdk.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pup Town">
<meta name="theme-color" content="#4fc3f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Pup Town Rescue</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4fc3f7;font-family:"Arial Rounded MT Bold","Chalkboard SE",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.big{font-size:9vmin;color:#fff;text-shadow:0 .6vmin 0 rgba(0,0,0,.25);margin:0;text-align:center}
.btn{border:none;border-radius:50%;width:24vmin;height:24vmin;font-size:12vmin;background:#ffca28;box-shadow:0 1.2vmin 0 #f57f17;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.btn:active{transform:translateY(.8vmin);box-shadow:0 .4vmin 0 #f57f17}
.btn.green{background:#66bb6a;box-shadow:0 1.2vmin 0 #2e7d32}
.hud{position:fixed;display:none;gap:2vmin;z-index:5}
.hud.on{display:flex}
.hb{width:13vmin;height:13vmin;min-width:80px;min-height:80px;border:none;border-radius:50%;font-size:7vmin;background:rgba(255,255,255,.85);box-shadow:0 .8vmin 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;position:relative}
.hb:active{transform:translateY(.5vmin)}
#hudR{top:calc(2vmin + env(safe-area-inset-top));right:calc(2vmin + env(safe-area-inset-right))}
#hudL{top:calc(2vmin + env(safe-area-inset-top));left:calc(2vmin + env(safe-area-inset-left))}
.pill{background:rgba(255,255,255,.85);border-radius:8vmin;padding:1vmin 3vmin;font-size:6vmin;display:flex;align-items:center;gap:1vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.2);height:13vmin;min-height:80px}
#pups{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
.pupcard{border:none;border-radius:5vmin;background:#fff;padding:2vmin;box-shadow:0 1.2vmin 0 rgba(0,0,0,.2);width:28vmin;height:34vmin;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pupcard canvas{position:static;width:24vmin;height:24vmin}
.pupcard .nm{font-size:5vmin;font-weight:bold}
.pupcard:active{transform:scale(.95)}
#reward{background:rgba(0,0,0,.45)}
.card{background:#fff;border-radius:6vmin;padding:4vmin 6vmin;display:flex;flex-direction:column;align-items:center;gap:2vmin;box-shadow:0 2vmin 0 rgba(0,0,0,.2);max-width:92vw}
.stars{font-size:14vmin;letter-spacing:2vmin}
.stars span{display:inline-block;transform:scale(0);animation:pop .5s forwards}
.stars span:nth-child(2){animation-delay:.35s}.stars span:nth-child(3){animation-delay:.7s}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.badgeBig{font-size:20vmin;animation:pop .6s 1s both}
.msg{font-size:7vmin;color:#e65100;font-weight:bold;text-align:center}
#badges .grid{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
.bd{width:24vmin;height:24vmin;border-radius:50%;background:#fff8e1;display:flex;align-items:center;justify-content:center;font-size:13vmin;border:1.2vmin solid #ffca28;position:relative}
.bd.off{filter:grayscale(1);opacity:.35;border-color:#bbb}
.bd small{position:absolute;bottom:-1vmin;right:-1vmin;background:#e53935;color:#fff;font-size:4.5vmin;border-radius:5vmin;padding:.5vmin 2vmin}
#settings .card{font-size:4vmin;gap:3vmin}
#settings input{font-size:5vmin;padding:1.5vmin 3vmin;border-radius:3vmin;border:.6vmin solid #90caf9;width:50vmin;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:3vmin;align-items:center}
.sbtn{font-size:4.5vmin;padding:2vmin 4vmin;border:none;border-radius:4vmin;background:#90caf9;font-weight:bold}
.sbtn.red{background:#ef9a9a}
#gateRing{position:absolute;inset:-6px;border-radius:50%;border:6px solid transparent;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen on">
  <p class="big">🐾 Pup Town Rescue 🐾</p>
  <button class="btn green" id="playBtn" aria-label="Play">▶️</button>
</div>

<div id="select" class="screen" style="background:#81d4fa">
  <p class="big">🐶 ❓</p>
  <div id="pups"></div>
</div>

<div id="reward" class="screen">
  <div class="card">
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="badgeBig" id="rwBadge">🏅</div>
    <div class="msg" id="rwMsg">Great job!</div>
    <button class="btn green" id="rwBtn" aria-label="Back to town">🏠</button>
  </div>
</div>

<div id="badges" class="screen" style="background:rgba(0,0,0,.45)">
  <div class="card">
    <div class="grid" id="bgrid"></div>
    <div class="pill" style="box-shadow:none">🦴 <span id="treatCount">0</span></div>
    <button class="btn green" id="bdClose" aria-label="Close">✅</button>
  </div>
</div>

<div id="settings" class="screen" style="background:rgba(0,0,0,.55)">
  <div class="card">
    <b>Grown-up settings</b>
    <div class="row">Player name: <input id="nameIn" maxlength="16" autocomplete="off"></div>
    <div class="row"><button class="sbtn" id="voiceBtn">🗣️ Voice: on</button><button class="sbtn" id="pupBtn">🐶 Change pup</button></div>
    <div class="row"><button class="sbtn red" id="resetBtn">↺ Reset progress</button></div>
    <button class="sbtn" id="setClose" style="background:#a5d6a7">✅ Done</button>
  </div>
</div>

<div class="hud" id="hudL">
  <button class="hb" id="homeBtn" aria-label="Back to town">🏠</button>
  <div class="pill" id="treatPill">🦴 <span id="treatHud">0</span></div>
</div>
<div class="hud" id="hudR">
  <button class="hb" id="hornBtn" aria-label="Horn">📣</button>
  <button class="hb" id="badgeBtn" aria-label="Badges">🏅</button>
  <button class="hb" id="muteBtn" aria-label="Sound">🔊</button>
  <button class="hb" id="gearBtn" aria-label="Grown-up settings (hold)">⚙️<div id="gateRing"></div></button>
</div>

<script>
"use strict";
// ---------- Save data ----------
const SAVE_KEY='pupTownRescue.v1';
const defaults={name:'Archer',pup:null,muted:false,voice:true,treats:0,badges:{fire:0,kitten:0,bridge:0,lost:0},got:[]};
let save;
try{save=Object.assign({},defaults,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));save.badges=Object.assign({},defaults.badges,save.badges);}catch(e){save=JSON.parse(JSON.stringify(defaults));}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

// ---------- Audio (WebAudio synth only) ----------
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=0.15,type='sine',vol=0.25,when=0,slide=0){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime+when;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+0.05);}
function noise(d=0.3,vol=0.15,hp=800){if(save.muted)return;const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={
  tap:()=>tone(660,0.08,'triangle',0.2),
  pop:()=>{tone(500,0.12,'sine',0.25,0,600);},
  treat:()=>{tone(880,0.08,'square',0.12);tone(1320,0.12,'square',0.12,0.07);},
  splash:()=>noise(0.25,0.18,1500),
  snap:()=>{tone(300,0.08,'square',0.2);tone(600,0.1,'triangle',0.2,0.05);},
  boing:()=>tone(220,0.3,'sine',0.25,0,300),
  horn:()=>{tone(392,0.25,'sawtooth',0.12);tone(494,0.25,'sawtooth',0.1);tone(392,0.25,'sawtooth',0.12,0.3);tone(494,0.25,'sawtooth',0.1,0.3);},
  meow:()=>tone(900,0.35,'triangle',0.2,0,-500),
  bark:()=>{tone(300,0.09,'square',0.2,0,-120);tone(320,0.09,'square',0.2,0.15,-120);},
  win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,0.18,'triangle',0.22,i*0.13));},
  start:()=>{[392,523,659].forEach((f,i)=>tone(f,0.12,'triangle',0.2,i*0.09));}
};
function say(t){if(save.muted||!save.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=0.95;u.pitch=1.3;speechSynthesis.speak(u);}catch(e){}}

// ---------- Pups (original characters) ----------
const PUPS=[
  {id:'ember',name:'Ember',job:'fire',fur:'#c8743c',fur2:'#f3d2a8',coat:'#e53935',icon:'🔥',veh:'fire'},
  {id:'scout',name:'Scout',job:'police',fur:'#6d5a4a',fur2:'#d9c3a5',coat:'#1e88e5',icon:'⭐',veh:'police'},
  {id:'bolt',name:'Bolt',job:'build',fur:'#9e9e9e',fur2:'#eeeeee',coat:'#fbc02d',icon:'🔧',veh:'digger'}
];
function pupObj(){return PUPS.find(p=>p.id===save.pup)||PUPS[0];}

function drawPup(g,x,y,s,p,happy=1){
  g.save();g.translate(x,y);g.scale(s,s);
  // ears
  g.fillStyle=p.fur;
  g.beginPath();g.ellipse(-34,-18,14,26,-0.5,0,7);g.fill();
  g.beginPath();g.ellipse(34,-18,14,26,0.5,0,7);g.fill();
  // head
  g.beginPath();g.arc(0,0,38,0,7);g.fill();
  g.fillStyle=p.fur2;g.beginPath();g.ellipse(0,14,24,20,0,0,7);g.fill();
  // hat
  g.fillStyle=p.coat;g.beginPath();g.ellipse(0,-30,30,12,0,0,7);g.fill();
  g.beginPath();g.moveTo(-22,-30);g.quadraticCurveTo(0,-62,22,-30);g.fill();
  g.font='18px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.icon,0,-40);
  // eyes
  g.fillStyle='#222';g.beginPath();g.arc(-13,-4,6,0,7);g.arc(13,-4,6,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-11,-6,2,0,7);g.arc(15,-6,2,0,7);g.fill();
  // nose & smile
  g.fillStyle='#222';g.beginPath();g.ellipse(0,8,7,5,0,0,7);g.fill();
  g.strokeStyle='#222';g.lineWidth=3;g.beginPath();g.arc(0,14,9*happy,0.2,Math.PI-0.2);g.stroke();
  g.fillStyle='#ff8a80';g.beginPath();g.ellipse(0,24,5,5*happy,0,0,7);g.fill();
  // collar
  g.fillStyle=p.coat;g.fillRect(-26,34,52,10);
  g.fillStyle='#ffd54f';g.beginPath();g.arc(0,44,7,0,7);g.fill();
  g.restore();
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawVehicle(g,x,y,p,face,t,s=1){
  g.save();g.translate(x,y);g.scale(face*s,s);
  const bob=Math.sin(t*12)*1.5;
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,34,60,10,0,0,7);g.fill();
  g.translate(0,bob);
  g.fillStyle=p.coat;rr(g,-58,-6,116,36,12);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';rr(g,-50,0,100,8,4);g.fill();
  if(p.veh==='fire'){g.strokeStyle='#eee';g.lineWidth=5;g.beginPath();g.moveTo(-50,-12);g.lineTo(30,-24);g.moveTo(-50,-4);g.lineTo(30,-16);g.stroke();for(let i=0;i<5;i++){g.beginPath();g.moveTo(-42+i*16,-10-i*2.4);g.lineTo(-42+i*16,-2-i*2.4);g.stroke();}}
  if(p.veh==='police'){const on=Math.floor(t*4)%2;g.fillStyle=on?'#ff1744':'#2979ff';rr(g,-12,-18,12,10,3);g.fill();g.fillStyle=on?'#2979ff':'#ff1744';rr(g,0,-18,12,10,3);g.fill();g.fillStyle='#fff';g.fillRect(-58,10,116,6);}
  if(p.veh==='digger'){g.strokeStyle='#f9a825';g.lineWidth=8;g.beginPath();g.moveTo(40,0);g.lineTo(70,-20);g.lineTo(82,10);g.stroke();g.fillStyle='#795548';g.beginPath();g.moveTo(74,4);g.lineTo(96,4);g.lineTo(88,22);g.closePath();g.fill();}
  g.fillStyle='#333';[-34,34].forEach(wx=>{g.beginPath();g.arc(wx,30,14,0,7);g.fill();g.fillStyle='#bbb';g.beginPath();g.arc(wx,30,6,0,7);g.fill();g.fillStyle='#333';});
  g.restore();
  drawPup(g,x+face*-6*s,y-30*s+bob,0.62*s,p);
}

// ---------- Canvas ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

// ---------- Town ----------
const WW=2400,WH=1800;
const RIVER={x:1680,w:170};
const ROADS_H=[420,900,1400],ROADS_V=[360,1050,2150];
const MISSIONS=[
  {id:'fire',x:620,y:640,icon:'🔥',badge:'🚒',say:'Fire! Spray the water!'},
  {id:'kitten',x:1330,y:1180,icon:'🐱',badge:'🐱',say:'Help the kitty down!'},
  {id:'bridge',x:RIVER.x+RIVER.w/2,y:900,icon:'🌉',badge:'🌉',say:'Fix the bridge!'},
  {id:'lost',x:2000,y:1600,icon:'🐥',badge:'🐥',say:'Find the baby ducks!'}
];
let town=null;
function rnd(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,((s^s>>>7)>>>0)%10000)/10000);}
function buildTown(){
  town=document.createElement('canvas');town.width=WW;town.height=WH;const g=town.getContext('2d');const R=rnd(7);
  g.fillStyle='#8bc34a';g.fillRect(0,0,WW,WH);
  for(let i=0;i<400;i++){g.fillStyle=R()<.5?'#7cb342':'#9ccc65';g.beginPath();g.arc(R()*WW,R()*WH,4+R()*10,0,7);g.fill();}
  // river
  g.fillStyle='#29b6f6';g.fillRect(RIVER.x,0,RIVER.w,WH);g.fillStyle='#4fc3f7';for(let y=0;y<WH;y+=60){g.fillRect(RIVER.x+30+(y%120?40:0),y,50,6);}
  // pond
  g.fillStyle='#4fc3f7';g.beginPath();g.ellipse(2000,1560,170,110,0,0,7);g.fill();
  // roads
  g.fillStyle='#78909c';ROADS_H.forEach(y=>g.fillRect(0,y-45,WW,90));ROADS_V.forEach(x=>g.fillRect(x-45,0,90,WH));
  g.fillStyle='#ffee58';ROADS_H.forEach(y=>{for(let x=0;x<WW;x+=80)g.fillRect(x,y-4,40,8);});ROADS_V.forEach(x=>{for(let y=0;y<WH;y+=80)g.fillRect(x-4,y,8,40);});
  // houses
  const cols=['#ef5350','#ab47bc','#5c6bc0','#26a69a','#ffa726','#ec407a','#8d6e63'];
  const spots=[[150,180],[560,200],[820,180],[1250,190],[1450,600],[150,650],[820,640],[1250,640],[150,1120],[560,1150],[820,1120],[2000,200],[2300,600],[1950,620],[2350,1150],[150,1620],[560,1640],[820,1620],[1300,1640]];
  spots.forEach(([x,y],i)=>{if(Math.abs(x-620)<120&&Math.abs(y-640)<120)return;house(g,x,y,cols[i%cols.length]);});
  // trees
  for(let i=0;i<70;i++){const x=R()*WW,y=R()*WH;if(nearRoad(x,y,80)||(x>RIVER.x-60&&x<RIVER.x+RIVER.w+60))continue;tree(g,x,y,0.8+R()*0.5);}
  g.fillStyle='#fff';g.font='bold 40px sans-serif';
}
function house(g,x,y,c){g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x-62,y+48,130,14);g.fillStyle='#fff3e0';g.fillRect(x-60,y-20,120,70);g.fillStyle=c;g.beginPath();g.moveTo(x-75,y-18);g.lineTo(x,y-80);g.lineTo(x+75,y-18);g.fill();g.fillStyle='#6d4c41';g.fillRect(x-14,y+10,28,40);g.fillStyle='#81d4fa';g.fillRect(x-48,y-6,24,20);g.fillRect(x+24,y-6,24,20);}
function tree(g,x,y,s){g.fillStyle='#795548';g.fillRect(x-8*s,y,16*s,36*s);g.fillStyle='#388e3c';g.beginPath();g.arc(x,y-10*s,36*s,0,7);g.fill();g.fillStyle='#43a047';g.beginPath();g.arc(x-12*s,y-20*s,20*s,0,7);g.fill();}
function nearRoad(x,y,m){return ROADS_H.some(r=>Math.abs(y-r)<m)||ROADS_V.some(r=>Math.abs(x-r)<m);}
buildTown();

const player={x:360,y:900,face:1,vx:0,vy:0};
let target=null,cam={x:0,y:0},treats=[],sparkles=[],cooldown={};
function spawnTreats(){treats=[];const R=rnd(Date.now()%100000);let n=0;while(n<14){const x=100+R()*(WW-200),y=100+R()*(WH-200);if(!nearRoad(x,y,40))continue;treats.push({x,y,b:R()*6});n++;}}
spawnTreats();
let bridgeFixed=false;

// ---------- Input ----------
const joy={active:false,id:null,bx:0,by:0,dx:0,dy:0};
function joyBase(){const r=Math.max(70,Math.min(W,H)*0.13);return{x:r+30,y:H-r-30,r};}
let scene='title';
cv.addEventListener('pointerdown',e=>{ac();e.preventDefault();
  if(scene==='town'){const jb=joyBase();if(Math.hypot(e.clientX-jb.x,e.clientY-jb.y)<jb.r*1.4){joy.active=true;joy.id=e.pointerId;joyMove(e);}else{target={x:e.clientX+cam.x,y:e.clientY+cam.y,t:0};SFX.tap();}}
  else if(scene==='mini'&&mini)mini.down(e.clientX,e.clientY,e.pointerId);
});
cv.addEventListener('pointermove',e=>{e.preventDefault();if(scene==='town'&&joy.active&&e.pointerId===joy.id)joyMove(e);else if(scene==='mini'&&mini)mini.move(e.clientX,e.clientY,e.pointerId);});
function up(e){if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.dx=joy.dy=0;}if(scene==='mini'&&mini)mini.up(e.clientX,e.clientY,e.pointerId);}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function joyMove(e){const jb=joyBase();let dx=e.clientX-jb.x,dy=e.clientY-jb.y;const d=Math.hypot(dx,dy);if(d>jb.r){dx*=jb.r/d;dy*=jb.r/d;}joy.dx=dx/jb.r;joy.dy=dy/jb.r;target=null;}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault();},{passive:false});

// ---------- Town update/draw ----------
function updateTown(dt,t){
  const SPEED=330;let mx=0,my=0;
  if(joy.active){mx=joy.dx;my=joy.dy;}
  else if(target){const dx=target.x-player.x,dy=target.y-player.y,d=Math.hypot(dx,dy);if(d<12)target=null;else{mx=dx/d;my=dy/d;}}
  player.x+=mx*SPEED*dt;player.y+=my*SPEED*dt;
  // river is crossable only on the bridge once fixed (otherwise boop back)
  const onBridge=Math.abs(player.y-900)<60;
  if(player.x>RIVER.x-30&&player.x<RIVER.x+RIVER.w+30&&!(onBridge&&bridgeFixed)){
    if(!(onBridge)){player.x=player.x<RIVER.x+RIVER.w/2?RIVER.x-30:RIVER.x+RIVER.w+30;target=null;}
  }
  player.x=Math.max(60,Math.min(WW-60,player.x));player.y=Math.max(80,Math.min(WH-50,player.y));
  if(Math.abs(mx)>0.1)player.face=mx>0?1:-1;
  cam.x=Math.max(0,Math.min(WW-W,player.x-W/2));cam.y=Math.max(0,Math.min(WH-H,player.y-H/2));
  if(WW<W)cam.x=(WW-W)/2;if(WH<H)cam.y=(WH-H)/2;
  // treats
  for(const tr of treats){if(!tr.got&&Math.hypot(tr.x-player.x,tr.y-player.y)<70){tr.got=true;save.treats++;persist();SFX.treat();burst(tr.x,tr.y,'#ffd54f');updHud();}}
  if(treats.every(t=>t.got))spawnTreats();
  // missions (approach to start)
  for(const m of MISSIONS){const d=Math.hypot(m.x-player.x,m.y-player.y);
    if(cooldown[m.id]&&d>200)cooldown[m.id]=false;
    if(!cooldown[m.id]&&d<90){cooldown[m.id]=true;startMission(m);return;}}
}
function burst(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*7;sparkles.push({x,y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,l:0.6,c});}}
function drawTown(t){
  ctx.fillStyle='#8bc34a';ctx.fillRect(0,0,W,H);

  }

  ctx.font=(jb.r*0.5)+'px sans-serif';ctx.fillText('🐾',jb.x+joy.dx*jb.r,jb.y+joy.dy*jb.r);

function drawSparkles(){for(const s of sparkles){ctx.globalAlpha=Math.max(0,s.l/0.6);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();}ctx.globalAlpha=1;}
function updSparkles(dt){for(const s of sparkles){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;s.l-=dt;}sparkles=sparkles.filter(s=>s.l>0);}

function hint(x,y,t){ctx.font='60px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👆',x+Math.sin(t*6)*8,y+20+Math.abs(Math.sin(t*6))*16);}

 fire(){const flames=[];const S=()=>Math.min(W,H)/700;

 // 2) Kitten: drag 3 ladder pieces to the glowing spots, then tap kitty
 kitten(){const S=()=>Math.min(W,H)/700;let pieces=[],idle=0,drag=null,kitDown=-1;
  const slots=()=>{const s=S(),tx=W*0.66;return[0,1,2].map(i=>({x:tx-90*s,y:H*0.78-60*s-i*120*s}));};

    if(best>=0&&bd<260*S()+60){p.slot=best;SFX.snap();burst(sl[best].x,sl[best].y,'#fff59d');if(pieces.every(q=>q.slot>=0)){SFX.meow();say('Tap the kitty!');}}else{p.home=true;SFX.boing();}},
   update(dt){idle+=dt;if(kitDown>=0&&kitDown<1){kitDown+=dt*0.6;if(kitDown>=1){kitDown=1;if(!this.done)finishMission();}}},
   draw(t){sky('#81d4fa','#e1f5fe');const s=S();ctx.fillStyle='#8bc34a';ctx.fillRect(0,H*0.8,W,H);

 },
 // 3) Bridge: drag colored planks to the matching colored hole
 bridge(){const S=()=>Math.min(W,H)/700;const C=[{c:'#e53935',sh:'■'},{c:'#1e88e5',sh:'●'},{c:'#fdd835',sh:'▲'}];

  const holes=()=>{const s=S();return[0,1,2].map(i=>({x:W*0.5+(i-1)*170*s,y:H*0.45}));};
  const order=[2,0,1];const homePos=i=>({x:W*0.5+(order.indexOf(i)-1)*220*S(),y:H*0.84});

   down(x,y,id){idle=0;const s=S();for(const p of pl){if(p.set)continue;const h=p.home?homePos(p.i):p;if(Math.abs(h.x-x)<100*s+30&&Math.abs(h.y-y)<60*s+30){drag={p,id};p.home=false;p.x=x;p.y=y;SFX.tap();return;}}},
   move(x,y,id){if(drag&&drag.id===id){drag.p.x=x;drag.p.y=y;}},
   up(x,y,id){if(!drag||drag.id!==id)return;const p=drag.p;drag=null;const hs=holes();const h=hs[p.i];

    else{p.home=true;SFX.boing();}},
   update(dt){idle+=dt;if(car>=0&&car<1){car+=dt*0.45;if(car>=1){car=1;if(!this.done)finishMission();}}},

    ctx.fillStyle='#8bc34a';ctx.fillRect(0,H*0.35,W,H*0.3);

    hs.forEach((h,i)=>{const p=pl[i];if(p.set)plank(h.x,h.y,p);else{ctx.save();ctx.setLineDash([12,10]);ctx.strokeStyle=p.c;ctx.lineWidth=8;rr(ctx,h.x-80*s,h.y-45*s,160*s,90*s,14*s);ctx.stroke();ctx.restore();ctx.globalAlpha=0.5+Math.sin(t*5)*0.3;ctx.fillStyle=p.c;ctx.font=(56*s)+'px sans-serif';ctx.fillText(p.sh,h.x,h.y+3);ctx.globalAlpha=1;}});

   }};},
 // 4) Ducks: tap the 4 hiding ducklings (behind bushes) - they hop to mama
 lost(){const S=()=>Math.min(W,H)/700;const spots=[[0.15,0.4],[0.38,0.7],[0.62,0.38],[0.85,0.68]];

const $=id=>document.getElementById(id);

  $('hudL').classList.toggle('on',inGame&&!anyOverlay);$('hudR').classList.toggle('on',inGame&&!anyOverlay);

  b.onclick=()=>{ac();SFX.bark();say(p.name+'!');save.pup=p.id;persist();goTown();};box.appendChild(b);});}
function goTown(){hideAll();scene='town';mini=null;updHud();}
$('playBtn').onclick=()=>{ac();SFX.start();if(save.pup)goTown();else{buildSelect();show('select');scene='select';}};
$('rwBtn').onclick=()=>{SFX.tap();goTown();};
$('homeBtn').onclick=()=>{SFX.tap();if(curMission){if(curMission.id==='bridge')player.x=RIVER.x-200;else player.y=curMission.y+160;}goTown();};
$('hornBtn').onclick=()=>{ac();SFX.horn();};
$('muteBtn').onclick=()=>{save.muted=!save.muted;persist();if(save.muted&&window.speechSynthesis)speechSynthesis.cancel();updHud();SFX.tap();};
$('badgeBtn').onclick=()=>{SFX.tap();const gr=$('bgrid');gr.innerHTML='';MISSIONS.forEach(m=>{const n=save.badges[m.id]||0;const d=document.createElement('div');d.className='bd'+(n?'':' off');d.textContent=m.badge;if(n){const s=document.createElement('small');s.textContent='×'+n;d.appendChild(s);}gr.appendChild(d);});$('treatCount').textContent=save.treats;show('badges');};
$('bdClose').onclick=()=>{SFX.tap();hideAll();updHud();};
// Grown-up gate: hold the gear for 2 seconds
let gateT=null,gateStart=0;
function gateDown(e){e.preventDefault();gateStart=performance.now();const ring=$('gateRing');gateT=setInterval(()=>{const p=(performance.now()-gateStart)/2000;ring.style.borderColor=`rgba(229,57,53,${Math.min(1,p)})`;ring.style.transform=`scale(${1+p*0.2})`;if(p>=1){gateUp();openSettings();}},50);}
function gateUp(){clearInterval(gateT);gateT=null;$('gateRing').style.borderColor='transparent';$('gateRing').style.transform='';}
$('gearBtn').addEventListener('pointerdown',gateDown);$('gearBtn').addEventListener('pointerup',gateUp);$('gearBtn').addEventListener('pointerleave',gateUp);$('gearBtn').addEventListener('pointercancel',gateUp);
function openSettings(){$('nameIn').value=save.name||'';$('voiceBtn').textContent='🗣️ Voice: '+(save.voice?'on':'off');show('settings');}
$('nameIn').addEventListener('input',e=>{save.name=e.target.value.slice(0,16);persist();});
$('voiceBtn').onclick=()=>{save.voice=!save.voice;persist();$('voiceBtn').textContent='🗣️ Voice: '+(save.voice?'on':'off');};
$('pupBtn').onclick=()=>{buildSelect();show('select');scene='select';};
$('resetBtn').onclick=()=>{if(confirm('Reset badges and treats?')){const n=save.name;save=JSON.parse(JSON.stringify(defaults));save.name=n;persist();bridgeFixed=false;buildSelect();show('select');scene='select';}};
$('setClose').onclick=()=>{$('nameIn').blur();hideAll();updHud();};

// ---------- Main loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  updSparkles(dt);
  if(scene==='town'){if(!document.querySelector('.screen.on'))updateTown(dt,t);drawTown(t);}
  else if(scene==='mini'&&mini){mini.update(dt);mini.draw(t);}
  else{sky('#4fc3f7','#b3e5fc');drawVehicle(ctx,W/2+Math.sin(t)*W*0.3,H*0.82,pupObj(),Math.cos(t)>0?1:-1,t,Math.min(W,H)/600);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
updHud();
// test hook (harmless): expose for automated screenshots
window.__game={startMission:id=>startMission(MISSIONS.find(m=>m.id===id)),finish:()=>finishMission(),save:()=>save,goTown};
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
