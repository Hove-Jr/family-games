<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Game Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Hub">
<meta name="theme-color" content="#07091a">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
/* iOS home-screen (standalone) WebKit bug: the layout viewport (innerHeight, inset:0, 100%, 100dvh) comes up ~one
   status-bar height short of the physical screen, leaving an unpainted (white) strip at the bottom. 100vh is the
   full screen there, so standalone uses 100vh, and --gap = the dead strip (kept clear of tappable controls). */
(function(){var d=document.documentElement,sa=!!(navigator.standalone||(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches)));
if(sa)d.classList.add('standalone');
function gap(){var g=0;if(sa){var a=screen.width,b=screen.height,full=innerWidth>innerHeight?Math.min(a,b):Math.max(a,b);g=Math.max(0,Math.min(120,full-innerHeight));}d.style.setProperty('--gap',g+'px');}
gap();addEventListener('resize',gap);addEventListener('orientationchange',function(){setTimeout(gap,150);setTimeout(gap,600);});})();
</script>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<!-- 1. WHO'S PLAYING -->
<section id="s-who" class="screen on">
  <div class="wrap">
    <header class="whohead">
      <div class="brand"><i></i>Game Hub</div>
      <h1 class="lt">Who&rsquo;s playing?</h1>
      <p>Pick your player to load your saves.</p>
    </header>
    <div id="who" class="ptiles"></div>
    <div class="foot">
      <button id="addBtn" class="pill subtle"><span class="lbl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add player</span></button>
      <button id="editBtn" class="pill subtle hold" data-hold="edit"><span class="ring"></span><span class="lbl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Grown-ups</span></button>
      <button id="doneBtn" class="pill go hidden">Done</button>
    </div>
  </div>
  <p id="holdHint" class="hint hidden">Keep holding&hellip;</p>
</section>

<!-- 2. GAME PICKER -->
<section id="s-games" class="screen">
  <div class="wrap">
    <header class="top">
      <button id="meBtn" class="me press" aria-label="Switch player"><span class="av"></span><span class="nm"></span>
        <span class="sw"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3L3 7l4 4"/><path d="M3 7h14"/><path d="M17 13l4 4-4 4"/><path d="M21 17H7"/></svg>Switch</span></button>
    </header>
    <div class="lthead"><div id="greet" class="eyebrow"></div><h1 class="lt">Games</h1></div>
    <div id="hero"></div>
    <h2 class="sec">All games <small id="gcount"></small></h2>
    <div id="games" class="grid"></div>
  </div>
</section>

<!-- 3. PLAY -->
<section id="s-play" class="screen play">
  <iframe id="frame" title="Game" allow="autoplay; fullscreen"></iframe>
  <button id="homeBtn" class="home" aria-label="Back to games"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></button>
</section>

<!-- profile editor -->
<div id="modal" class="modal hidden">
  <div class="card">
    <h2 id="mTitle">New player</h2>
    <div class="prev"><span id="mPrev" class="bigav">🐯</span></div>
    <label class="fld">Name<input id="mName" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Name"></label>
    <label class="fld">Age (helps pick game difficulty)<input id="mAge" type="number" inputmode="numeric" min="2" max="99" placeholder="optional"></label>
    <div class="lbl2">Picture</div>
    <div id="mAvs" class="avs"></div>
    <div class="lbl2">Color</div>
    <div id="mCols" class="cols"></div>
    <div class="row">
      <button id="mDel" class="pill danger hold" data-hold="del"><span class="ring"></span><span class="lbl">🗑️ Hold to delete</span></button>
      <span class="sp"></span>
      <button id="mCancel" class="pill ghost">Cancel</button>
      <button id="mSave" class="pill go">Save</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="games.js"></script>
<script src="hub.js"></script>
</body>
</html>
